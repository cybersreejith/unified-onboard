version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "12001:12001"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "12000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:12001
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped